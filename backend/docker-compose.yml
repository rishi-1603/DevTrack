version: "3.9"

services:
  api:
    build: .
    container_name: devtrack_api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: DevTrack
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql://devtrack:devtrack@db:5432/devtrack
      SECRET_KEY: replace-with-a-long-random-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      DASHBOARD_CACHE_TTL_SECONDS: "60"
      LOG_DIR: logs
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: devtrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack
      POSTGRES_DB: devtrack
    ports:
      - "5432:5432"
    volumes:
      - devtrack_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devtrack_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  devtrack_pgdata:
