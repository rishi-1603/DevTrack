# Top-level `version:` removed (Day 5): it is obsolete in Compose v2 and emits
# a warning on every invocation. Verified with `docker compose config`, which
# is now run in CI -- this file had never been validated by anything before.
services:
  # ---------------------------------------------------------------------------
  # WHY THIS SERVICE EXISTS (added Day 6: it fixes a bug that had never been
  # caught, because nothing had ever run `docker compose up` on this stack)
  #
  # Before this service existed, NOTHING in the compose stack created the
  # database schema:
  #   * the image's CMD is a bare `uvicorn app.main:app ...` (backend/Dockerfile)
  #     -- no entrypoint, no migration step;
  #   * app/main.py:on_startup() calls create_all() ONLY when DATABASE_URL
  #     starts with "sqlite", and compose sets a Postgres URL;
  #   * so `docker compose up` brought the API and worker up against a
  #     completely EMPTY Postgres, and the first DB-touching request would fail
  #     with `relation "users" does not exist`.
  #
  # It went unnoticed for the life of the project because the two places this
  # stack was ever exercised both create the schema some other way: the pytest
  # suite runs on SQLite (where on_startup() does call create_all), and the
  # real-infra-smoke-test CI job runs `alembic upgrade head` as a separate
  # manual step ON THE RUNNER before starting uvicorn. Neither path runs the
  # containers as actually deployed. The compose-smoke-test job added alongside
  # this service is what closes that gap.
  #
  # Why a one-shot service rather than migrations in the API's command:
  #   * it runs EXACTLY once. Putting `alembic upgrade head &&` in both api's
  #     and worker's commands would run two concurrent migrations against one
  #     database -- Alembic takes no lock, so that is a race, not a redundancy.
  #   * `condition: service_completed_successfully` on the dependants (below)
  #     means api/worker cannot start until the schema exists, which also fixes
  #     the "works on second `up` but not the first" class of bug.
  #   * it keeps the Dockerfile's CMD single-purpose; the same image serves as
  #     api, worker and migrator with only the command differing.
  #
  # `restart: "no"` is REQUIRED and not the default-by-omission it looks like:
  # the rest of this file uses `restart: unless-stopped`, which would restart a
  # container that exits 0 and turn a one-shot migration into an infinite loop.
  #
  # Compose detail worth recording, because it is counter-intuitive:
  # `docker compose up --wait` exits 1 on ANY container that has exited, even
  # with code 0, UNLESS a long-running service depends on it with
  # `service_completed_successfully` -- that condition is what tells compose the
  # exit was the intended outcome (docker/compose#10596). Both api and worker
  # declare it below, so `up --wait` returns 0 with this container exited.
  # ---------------------------------------------------------------------------
  migrate:
    build: .
    container_name: devtrack_migrate
    command: alembic upgrade head
    environment:
      # Must be set explicitly: Settings.DATABASE_URL defaults to a localhost
      # URL, which inside this container would point at nothing.
      DATABASE_URL: postgresql://devtrack:devtrack@db:5432/devtrack
      # The only field Settings requires without a default; migrations/env.py
      # imports app.core.config, so importing it at all needs this.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in a .env file -- see backend/.env.example}
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: devtrack_api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: DevTrack
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql://devtrack:devtrack@db:5432/devtrack
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in a .env file -- see backend/.env.example}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      DASHBOARD_CACHE_TTL_SECONDS: "60"
      LOG_DIR: logs
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
    volumes:
      - ./logs:/app/logs
      # Shared with the worker container: the export CSVs a Celery task
      # writes to disk must be visible to the api container's download
      # endpoint too. Without this shared volume, the worker and api
      # containers would each have their own separate filesystem and
      # GET /export-jobs/{id}/download would 404/500 looking for a file
      # that only exists inside the worker container -- a real bug that
      # would only surface once this ran as actually-separate containers,
      # not when running both processes on one machine during development.
      - devtrack_exports:/app/exports
    # Was the short form (`- db`, `- redis`), which means service_started:
    # wait for the CONTAINER to start, not for Postgres to accept connections.
    #
    # This is not a crash risk -- on_startup() is deliberately DB-tolerant
    # (create_all runs only for SQLite, and recover_stranded_export_jobs is
    # wrapped in a broad except that logs and continues, so boot is never
    # blocked). The real consequence of the race is subtler and worse than a
    # crash, because it is silent: if Postgres is not yet accepting
    # connections, that startup recovery step is SKIPPED, so export jobs left
    # stranded by a previous crash stay unrecovered until the next restart.
    # Requests served during the window also fail with 500s.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Without this edge the API starts against an unmigrated database and
      # every DB-touching request 500s with `relation ... does not exist`.
      # It is also what lets `docker compose up --wait` treat migrate's exit 0
      # as success rather than as a dead container (see the migrate service).
      migrate:
        condition: service_completed_successfully
    # Python, not curl: backend/Dockerfile installs only gcc and libpq-dev on
    # python:3.12-slim-trixie, neither of which provides curl/wget/nc. A
    # curl-based check would fail forever and, now that `db`/`redis` gate on
    # health, anything gating on this service would never start.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped

  worker:
    build: .
    container_name: devtrack_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      APP_NAME: DevTrack
      APP_ENV: development
      DATABASE_URL: postgresql://devtrack:devtrack@db:5432/devtrack
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in a .env file -- see backend/.env.example}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      LOG_DIR: logs
      LOG_LEVEL: INFO
    volumes:
      - ./logs:/app/logs
      - devtrack_exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The worker writes to export_jobs (and reads projects/issues while
      # building a CSV), so it needs the schema just as much as the API does.
      # Gating it here rather than relying on "the API will have migrated by
      # the time a task arrives" keeps the ordering declarative: a worker that
      # starts before the schema exists can pick up a task and fail on it.
      migrate:
        condition: service_completed_successfully
    # Deliberately NO healthcheck on the worker, and this is a decision rather
    # than an oversight. Unlike CertiFake's workers (which run a metrics HTTP
    # server on :8000), this Celery worker exposes no HTTP surface at all, so
    # there is nothing to probe. The alternatives are both worse:
    #   * `celery inspect ping` does a broadcast round-trip through the broker;
    #     it is slow, can time out under load, and combined with
    #     `restart: unless-stopped` a false negative would cause a restart loop
    #     -- a self-inflicted outage nobody can debug from a compose file.
    #   * Adding an HTTP server purely to have something to probe is new
    #     surface area for its own sake.
    # What IS covered: if the worker process exits, the container exits and the
    # restart policy brings it back; and Celery retries broker connection on its
    # own, so a slow Redis is survivable. A real liveness signal (a heartbeat
    # file, or `inspect ping` with a generous threshold tuned against an actual
    # running stack) needs a live deployment to calibrate and is recorded as a
    # future improvement, not faked here.
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: devtrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack
      POSTGRES_DB: devtrack
    ports:
      - "5432:5432"
    volumes:
      - devtrack_pgdata:/var/lib/postgresql/data
    # pg_isready verified present at /usr/bin/pg_isready in postgres:16
    # (amd64 sha256:a85daf0d...) by listing its layer contents -- not assumed.
    # A healthcheck naming a binary the image lacks marks it permanently
    # unhealthy, and `api`/`worker` now gate on that, so they would never
    # start: a worse outcome than having no healthcheck at all.
    # start_period covers initial cluster init on an empty volume, which is
    # slower than a warm restart.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtrack -d devtrack"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: devtrack_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # redis-cli verified present at /usr/local/bin/redis-cli in redis:7-alpine
    # (amd64 sha256:ca0acbb1...) by listing its layer contents.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  devtrack_pgdata:
  devtrack_exports:
