version: "3.9"

services:
  api:
    build: .
    container_name: devtrack_api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: DevTrack
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql://devtrack:devtrack@db:5432/devtrack
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in a .env file -- see backend/.env.example}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_MINUTES: "10080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      DASHBOARD_CACHE_TTL_SECONDS: "60"
      LOG_DIR: logs
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
    volumes:
      - ./logs:/app/logs
      # Shared with the worker container: the export CSVs a Celery task
      # writes to disk must be visible to the api container's download
      # endpoint too. Without this shared volume, the worker and api
      # containers would each have their own separate filesystem and
      # GET /export-jobs/{id}/download would 404/500 looking for a file
      # that only exists inside the worker container -- a real bug that
      # would only surface once this ran as actually-separate containers,
      # not when running both processes on one machine during development.
      - devtrack_exports:/app/exports
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: devtrack_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      APP_NAME: DevTrack
      APP_ENV: development
      DATABASE_URL: postgresql://devtrack:devtrack@db:5432/devtrack
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in a .env file -- see backend/.env.example}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      LOG_DIR: logs
      LOG_LEVEL: INFO
    volumes:
      - ./logs:/app/logs
      - devtrack_exports:/app/exports
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: devtrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devtrack
      POSTGRES_PASSWORD: devtrack
      POSTGRES_DB: devtrack
    ports:
      - "5432:5432"
    volumes:
      - devtrack_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devtrack_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  devtrack_pgdata:
  devtrack_exports:
