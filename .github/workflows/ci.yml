name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app

      - name: Security scan (pip-audit)
        # Day-7 remediation (finding S3): this used to be
        #   pip-audit --desc || true
        # with continue-on-error -- non-blocking twice over, so the last green
        # build before the change printed "Found 37 known vulnerabilities in 5
        # packages" and still reported success. The old reasoning in this comment
        # ("a transitive CVE may not be reachable") was sound as far as it went,
        # but the conclusion was wrong: unreachable advisories are handled by a
        # visible per-ID waiver, not by disabling the gate for everything.
        #
        # The pins are now clean (python-jose -> PyJWT, python-multipart 0.0.9 ->
        # 0.0.32, fastapi 0.115.0 -> 0.142.2 taking starlette 0.38.6 -> 1.7.0,
        # pytest 8.3.3 -> 9.1.1, psycopg2-binary pinned exactly), verified with
        # `pip-audit` on the installed environment and on
        # `pip-audit -r requirements.txt`: "No known vulnerabilities found", zero
        # waivers.
        #
        # If a future advisory has no available fix, do NOT re-add `|| true`. Use
        # `--ignore-vuln <ID>` with a comment saying why it is not reachable from
        # this app's code paths and the date to re-review, so the waiver is
        # visible here rather than buried in a log nobody reads.        #
        # pip AND setuptools are upgraded here to keep this step self-contained
        # if reordered: pip-audit audits the WHOLE environment, including build
        # tools the runner preinstalls that this repo never ships, and outdated
        # ones trip their own advisories -- PYSEC-2026-3721 for pip, and
        # PYSEC-2026-3447 for the runner's setuptools 79.0.1, which turned the
        # sibling CertiFake job red the moment its audit became blocking.
        # Upgrading is the right response; waiving is not, because `--ignore-vuln`
        # here would hide the same advisory if it ever reached a shipped image.
        # That is why the docker-build job also scans the IMAGE from the inside,
        # as built, with nothing upgraded first -- a scan that cannot be
        # satisfied by fixing the runner.
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install -q pip-audit
          pip-audit --desc

      - name: Run unit/integration tests (isolated SQLite, no external services)
        run: pytest app/tests/ --cov=app --cov-report=term-missing

  postgres-migration-check:
    # Runs Alembic migrations against a REAL Postgres service container,
    # not SQLite. This exists because SQLite is far more permissive than
    # Postgres about types, constraints, and duplicate index names --
    # this project has already hit a real migration bug (a duplicate
    # index definition) that SQLite's test suite above would never catch,
    # since app/tests/conftest.py builds its schema via
    # Base.metadata.create_all(), not by running the actual migration
    # files. This job runs the actual migrations against the actual
    # target database engine.
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack
          POSTGRES_DB: devtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://devtrack:devtrack@localhost:5432/devtrack
      SECRET_KEY: ci-only-secret-not-used-anywhere-real

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations against real Postgres
        run: alembic upgrade head

      - name: Verify a second `alembic downgrade base` + re-upgrade round-trips cleanly
        # Every migration's downgrade() is otherwise never exercised by
        # anything -- this catches an asymmetric/broken downgrade() before
        # it becomes someone's 2am production rollback surprise.
        run: |
          alembic downgrade base
          alembic upgrade head

  real-infra-smoke-test:
    # Starts the actual API against real Postgres + a real Celery worker
    # against real Redis, and drives the flagship Day 2 features (async
    # export, rate limiting) over real HTTP -- the same manual verification
    # already done once by hand during development, now automated so it
    # runs on every push instead of being trusted to have "still worked"
    # since the last time a human checked. This is deliberately separate
    # from the eager-mode pytest suite above, which intentionally fakes
    # out Celery/Redis to stay fast and isolated -- this job exists
    # specifically to prove the real, non-faked integration still works.
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack
          POSTGRES_DB: devtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://devtrack:devtrack@localhost:5432/devtrack
      SECRET_KEY: ci-only-secret-not-used-anywhere-real
      REDIS_HOST: localhost
      REDIS_PORT: "6379"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Start API server
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &

      - name: Start Celery worker
        run: nohup celery -A app.core.celery_app.celery_app worker --loglevel=info --pool=solo > worker.log 2>&1 &

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 1
          done
          echo "API never became ready"; cat api.log; exit 1

      - name: Smoke test -- register, login, project, async export
        run: |
          set -e
          BASE=http://localhost:8000
          EMAIL="ci-smoke-$(date +%s)@example.com"

          curl -sf -X POST $BASE/auth/register \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"CI Smoke\",\"email\":\"$EMAIL\",\"password\":\"password123\"}" > /dev/null

          TOKEN=$(curl -sf -X POST $BASE/auth/login \
            -d "username=$EMAIL&password=password123" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          test -n "$TOKEN"

          PROJECT_ID=$(curl -sf -X POST $BASE/projects \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"title":"CI Smoke Project","description":"created by CI"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          test -n "$PROJECT_ID"

          curl -sf -X POST $BASE/issues \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"title\":\"CI issue\",\"description\":\"x\",\"project_id\":$PROJECT_ID,\"priority\":\"medium\"}" > /dev/null

          JOB_ID=$(curl -sf -X POST $BASE/projects/$PROJECT_ID/export \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          test -n "$JOB_ID"

          STATUS="pending"
          for i in $(seq 1 20); do
            STATUS=$(curl -sf $BASE/export-jobs/$JOB_ID -H "Authorization: Bearer $TOKEN" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            if [ "$STATUS" = "completed" ]; then break; fi
            sleep 0.5
          done
          if [ "$STATUS" != "completed" ]; then
            echo "Export job never completed (status=$STATUS)"; cat worker.log; exit 1
          fi

          curl -sf $BASE/export-jobs/$JOB_ID/download -H "Authorization: Bearer $TOKEN" -o export.csv
          test -s export.csv
          grep -q "CI issue" export.csv

          echo "Async export smoke test passed."

      - name: Smoke test -- rate limiting returns real 429s
        run: |
          set -e
          BASE=http://localhost:8000
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST $BASE/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"nobody@example.com","password":"wrongpassword"}')
            echo "attempt $i -> $CODE"
          done
          FINAL=$(curl -s -o /dev/null -w "%{http_code}" -X POST $BASE/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"nobody@example.com","password":"wrongpassword"}')
          if [ "$FINAL" != "429" ]; then
            echo "Expected 429 after exceeding the login rate limit, got $FINAL"; exit 1
          fi
          echo "Rate-limit smoke test passed."

      - name: Show server/worker logs on failure
        if: failure()
        run: |
          echo "---- api.log ----"; cat api.log || true
          echo "---- worker.log ----"; cat worker.log || true

  docker-build:
    # Verifies backend/Dockerfile actually builds. Added Day 3 after the
    # identical job caught a genuine, previously-unknown build failure in
    # the sibling CertiFake project (its unpinned python:3.11-slim base had
    # moved to Debian trixie, where three of its apt packages no longer
    # exist). Nothing had ever built this project's image either -- the
    # `test` and smoke-test jobs above deliberately run against the
    # runner's own Python, not the container, so a broken Dockerfile would
    # have gone unnoticed here too.
    #
    # Build context is backend/ (matching docker-compose.yml's `build: .`
    # inside backend/), so the image sees requirements.txt and app/ at the
    # paths its COPY instructions expect.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t devtrack-api:ci backend
      - name: Security scan of the built image (audits what actually ships)
        # WHY A SECOND SCAN, WHEN THE `test` JOB ALREADY RUNS pip-audit
        # -------------------------------------------------------------
        # That one audits the RUNNER's Python. It proves the pins resolve cleanly
        # on this interpreter, but the artifact that ships is this image, built
        # FROM python:3.12-slim-trixie, which contributes its own pip and setuptools -- neither
        # appears in requirements.txt, so no pin bump can reach them and no
        # runner-side scan can see them. Not hypothetical: the runner scan went
        # red on setuptools 79.0.1 (PYSEC-2026-3447, fix 83.0.0), a package this
        # repo never installs.
        #
        # This audits the image AS BUILT. pip-audit is installed at runtime so it
        # never becomes a layer of the shipped image, and nothing is upgraded
        # before the scan: if the base layer carries a vulnerable build tool the
        # job must go red, so the fix lands in the Dockerfile -- where it changes
        # what ships -- instead of in a command that only changes what the
        # scanner happens to see.
        run: |
          docker run --rm --entrypoint sh devtrack-api:ci -c '
            set -e
            pip install --quiet --no-cache-dir pip-audit
            echo "--- build tools the base image contributed ---"
            pip freeze | grep -iE "^(pip|setuptools|wheel)==" || echo "(none reported)"
            pip-audit --desc
          '

  # ===========================================================================
  # Boots backend/docker-compose.yml for real and drives requests through it.
  #
  # WHY THIS IS A SEPARATE JOB FROM real-infra-smoke-test
  # -----------------------------------------------------
  # That job already drives the same HTTP sequence against real Postgres and
  # real Redis and passes -- but it runs uvicorn and celery as bare processes
  # on the runner, uses GitHub Actions service containers for the
  # infrastructure, and runs `alembic upgrade head` as its own manual step. So
  # it tests the APPLICATION against real infra; it has never tested the
  # DEPLOYMENT ARTIFACT. Untested until now: docker-compose.yml itself,
  # Dockerfile's CMD, service-name DNS between containers, the healthchecks,
  # and the shared volume between api and worker.
  #
  # That distinction is not academic -- it is how a real bug was found. The
  # compose stack had no schema-creation step at all: the image CMD is a bare
  # uvicorn, and app/main.py:on_startup() calls create_all() only for SQLite
  # while compose configures Postgres. So `docker compose up` brought the API
  # up against an EMPTY database, where every DB-touching request fails with
  # `relation "users" does not exist`. Both places the stack was ever exercised
  # create the schema some other way (pytest uses SQLite; real-infra-smoke-test
  # migrates on the runner), so nothing could have caught it. Fixed by the
  # one-shot `migrate` service in backend/docker-compose.yml, which api and
  # worker gate on with condition: service_completed_successfully.
  #
  # See scripts/compose_smoke_test.sh for the assertions, which include the one
  # that only separate containers can make: the export CSV written by the
  # worker container must be readable by the api container via the shared
  # devtrack_exports volume.
  # ===========================================================================
  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build
    # Four services, two of which are built from the same Dockerfile, plus a
    # Celery worker that has to pick up a real task from a real broker.
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    env:
      # The only Settings field without a default; compose requires it to
      # interpolate (`${SECRET_KEY:?...}`). Throwaway value -- nothing here is
      # a real credential, and the app deliberately has no insecure fallback so
      # that a missing secret is loud rather than silently "working".
      #
      # Lengthened from 31 to 37 characters by the Day-7 remediation (finding
      # S15): Settings now enforces the RFC 7518 3.2 minimum of 32 bytes for an
      # HS256 key, so the previous value would have failed this job's own
      # startup. Still a throwaway -- it is a length requirement, not a secret.
      SECRET_KEY: ci-smoke-only-not-a-real-secret-value

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --wait blocks until every healthchecked service reports healthy, so
      # this step is also the first empirical confirmation that the api/db/
      # redis healthchecks pass in a live stack -- until now they were only
      # reasoned about (by verifying pg_isready/redis-cli/python exist in the
      # exact images via their layer tarballs). It returns 0 despite `migrate`
      # exiting, because api and worker depend on it with
      # service_completed_successfully -- without that edge compose treats any
      # exited container as a wait failure (docker/compose#10596).
      - name: Boot the stack and wait for healthchecks
        run: |
          docker compose version
          docker compose up -d --build --wait --wait-timeout 600

      # Recorded pass or fail: `migrate` exits 0 by design, so a plain
      # `docker compose ps` (which hides exited containers) would look like the
      # service vanished. -a shows it and its exit status.
      - name: Report container states (including the one-shot migrator)
        if: always()
        run: docker compose ps -a

      - name: Run the compose smoke test
        run: bash ../scripts/compose_smoke_test.sh

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 120

      - name: Tear down (volumes too, so no state leaks between runs)
        if: always()
        run: docker compose down -v --remove-orphans --timeout 30

  config-validation:
    # Deployment-config checks, added Day 5. Motivation is concrete, not
    # theoretical: the sibling CertiFake project's compose stack was broken
    # for 17 days because MinIO deleted `minio/minio` from Docker Hub on
    # 2026-09-11, and nothing caught it -- `docker-compose config` validates
    # SYNTAX, not whether an image still exists, and no Docker daemon was
    # available where any of this was developed, so the stack was never
    # actually brought up.
    #
    # None of the three checks below needs a Docker daemon: compose
    # validation is client-side, and image existence is answered anonymously
    # by the registry v2 API.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (for the consistency checker)
        run: python -m pip install -q pyyaml

      - name: Validate docker-compose.yml
        # SECRET_KEY is required for interpolation; the value is irrelevant
        # here because nothing is started, only parsed.
        env:
          SECRET_KEY: ci-validation-only-not-a-real-secret
        working-directory: backend
        run: |
          docker compose version
          docker compose config --quiet
          echo "compose config: valid"

      - name: Check every referenced image still exists in its registry
        # Resolves compose `image:` refs AND Dockerfile `FROM` lines. Docker
        # Hub reports a nonexistent repository with the same 401 it uses for
        # a private one, so the script distinguishes them by whether the
        # token service granted any pull scope -- validated against
        # known-good (postgres, redis) and known-bad (minio/minio,
        # bitnami/minio) controls.
        run: python3 scripts/check_images.py backend/docker-compose.yml backend/Dockerfile

      - name: Cross-file consistency (compose <-> code expectations)
        # Asserts things no single-file validator can see: a service that
        # sets DATABASE_URL/REDIS_HOST pointing at another service must have
        # a depends_on edge for it; nothing may gate on
        # `condition: service_healthy` for a service that defines no
        # healthcheck (that wedges the dependent forever); no placeholder
        # image strings; no obsolete top-level `version:`.
        run: python3 scripts/check_config_consistency.py
